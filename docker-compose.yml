services:
  db:
    image: postgres:16-alpine
    container_name: gxp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-gxp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gxp}
      POSTGRES_DB: ${DB_NAME:-gxp}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gxp} -d ${DB_NAME:-gxp}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
